
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="calculator">
        <header class="header">
            <div>
                <h2>Calculator</h2>
                <p>Smart calculation</p>
            </div>
            <button id="themeBtn" class="theme-btn" aria-label="Toggle theme">☀</button>
        </header>

        <section class="screen">
            <div id="history" class="history"></div>
            <input id="display" type="text" value="0"
                readonly aria-label="Calculator display">
        </section>

        <section class="keys" id="keys">
            <button class="clear" data-action="clear">AC</button>
            <button data-action="delete">DEL</button>
            <button class="operator" data-action="percent">%</button>
            <button class="operator" data-op="/">÷</button>

            <button data-num="7">7</button>
            <button data-num="8">8</button>
            <button data-num="9">9</button>
            <button class="operator" data-op="*">×</button>

            <button data-num="4">4</button>
            <button data-num="5">5</button>
            <button data-num="6">6</button>
            <button class="operator" data-op="-">−</button>

            <button data-num="1">1</button>
            <button data-num="2">2</button>
            <button data-num="3">3</button>
            <button class="operator" data-op="+">+</button>

            <button data-action="sign">+/−</button>
            <button data-num="0">0</button>
            <button data-action="dot">.</button>
            <button class="equals" data-action="equals">=</button>
        </section>

        <footer>created by Rupesh chaurasiya</footer>
    </main>

</body>
</html>
